<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TGS Dijital Asistanım</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="menu-cubugu">
        <h2>Tgs Asistan</h2>
        <button onclick="sayfaAc('gunluk')">Günlük Notlarım</button>
        <button onclick="sayfaAc('haftalik')">Haftalık Planlayıcı</button>
        <button onclick="sayfaAc('aylik')">Aylık Planlayıcı</button>
        <button onclick="sayfaAc('toplanti')">Toplantılar</button>
        <button onclick="sayfaAc('randevu')">Randevular</button>
    </div>

   <div class="icerik-alani">
    <div id="gunluk" class="sayfa-icerik">
        <h1>Günlük Notlarım</h1>
        <textarea id="not-alani" style="width:100%; height:150px; border-radius:10px; padding:10px;" placeholder="Bugün neler yapacaksın?"></textarea>
        <br>
        <button onclick="notEkle()" style="margin-top:10px; padding:10px 20px; background:navy; color:white; border:none; border-radius:5px; cursor:pointer;">Notu Kaydet</button>
        
        <div style="margin-top:20px;">
            <h3>Yapılacaklar</h3>
            <div id="kayitli-notlar"></div>
        </div>

        <div style="margin-top:20px; opacity:0.6;">
            <h3>Tamamlananlar</h3>
            <div id="tamamlanan-notlar"></div>
        </div>
    </div>

    <div id="haftalik" class="sayfa-icerik" style="display:none;">
    <h1 style="color: navy;">Haftalık Planlayıcı</h1>
    <table border="1" style="width: 100%; border-collapse: collapse; background-color: white;">
        <thead>
            <tr style="background-color: navy; color: white;">
                <th style="padding: 10px; border: 1px solid white;">Pazartesi</th>
                <th style="padding: 10px; border: 1px solid white;">Salı</th>
                <th style="padding: 10px; border: 1px solid white;">Çarşamba</th>
                <th style="padding: 10px; border: 1px solid white;">Perşembe</th>
                <th style="padding: 10px; border: 1px solid white;">Cuma</th>
                <th style="padding: 10px; border: 1px solid white;">Cumartesi</th>
                <th style="padding: 10px; border: 1px solid white;">Pazar</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td style="border: 1px solid navy;"><textarea style="width:100%; height:300px; border:none; outline:none; padding:5px; box-sizing: border-box;"></textarea></td>
                <td style="border: 1px solid navy;"><textarea style="width:100%; height:300px; border:none; outline:none; padding:5px; box-sizing: border-box;"></textarea></td>
                <td style="border: 1px solid navy;"><textarea style="width:100%; height:300px; border:none; outline:none; padding:5px; box-sizing: border-box;"></textarea></td>
                <td style="border: 1px solid navy;"><textarea style="width:100%; height:300px; border:none; outline:none; padding:5px; box-sizing: border-box;"></textarea></td>
                <td style="border: 1px solid navy;"><textarea style="width:100%; height:300px; border:none; outline:none; padding:5px; box-sizing: border-box;"></textarea></td>
                <td style="border: 1px solid navy;"><textarea style="width:100%; height:300px; border:none; outline:none; padding:5px; box-sizing: border-box;"></textarea></td>
                <td style="border: 1px solid navy;"><textarea style="width:100%; height:300px; border:none; outline:none; padding:5px; box-sizing: border-box;"></textarea></td>
            </tr>
        </tbody>
    </table>
</div>

  <div id="aylik" class="sayfa-icerik" style="display:none; padding: 20px;">
        <h1 id="dinamik-baslik" style="color: navy; text-align: center;">Nisan 2026</h1>
      <div style="margin-bottom: 20px; display: flex; gap: 10px; justify-content: center;">
    <select id="ay-secimi" onchange="aylikPlaniHazirla()" style="padding: 10px; border-radius: 8px; border: 2px solid navy; font-weight: bold;">
        <option value="Ocak">Ocak</option>
        <option value="Şubat">Şubat</option>
        <option value="Mart">Mart</option>
        <option value="Nisan" selected>Nisan</option>
        <option value="Mayıs">Mayıs</option>
        <option value="Haziran">Haziran</option>
        <option value="Temmuz">Temmuz</option>
        <option value="Ağustos">Ağustos</option>
        <option value="Eylül">Eylül</option>
        <option value="Ekim">Ekim</option>
        <option value="Kasım">Kasım</option>
        <option value="Aralık">Aralık</option>
    </select>

    <select id="yil-secimi" onchange="aylikPlaniHazirla()" style="padding: 10px; border-radius: 8px; border: 2px solid navy; font-weight: bold;">
        <option value="2025">2025</option>
        <option value="2026" selected>2026</option>
        <option value="2027">2027</option>
        <option value="2028">2028</option>
    </select>
</div>

        <div id="takvim-kutusu" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 15px;">
            </div>
    </div>
<div id="toplanti" class="sayfa-icerik" style="display:none; padding: 20px; text-align: center;">
    
    <h1 style="color: #D32F2F; font-size: 45px; font-weight: bold; margin-bottom: 30px; font-family: sans-serif;">TOPLANTILAR</h1>
    
    <div style="display: inline-block; width: 95%; max-width: 600px; text-align: left;">
        
        <p style="font-weight: bold; font-size: 18px; margin-bottom: 10px;">Toplantı Notlarınızı Buraya Giriniz</p>
        <textarea id="toplanti-konu" placeholder="Notunuzu buraya yazın..." style="width: 100%; height: 150px; padding: 15px; border-radius: 15px; border: 2px solid #333; font-size: 16px; margin-bottom: 20px; resize: none; box-sizing: border-box;"></textarea>
        
        <p style="font-weight: bold; font-size: 16px; margin-bottom: 8px;">Tarih ve Saat Ayarla</p>
        <input type="datetime-local" id="toplanti-zaman" style="width: 60%; padding: 10px; border-radius: 10px; border: 2px solid #333; margin-bottom: 25px; font-size: 16px; box-sizing: border-box; display: block;">
        
        <div style="text-align: center;">
            <button onclick="toplantiEkle()" style="background: navy; color: white; padding: 10px 40px; border: 2px solid #333; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px;">Ekle</button>
        </div>

    </div>

    <div id="toplanti-listesi" style="margin-top: 30px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px;"></div>
</div>
       <div id="randevular" class="sayfa-icerik" style="display:none; padding: 20px; text-align: center;">
    
    <h1 style="color: navy; font-size: 45px; font-weight: bold; margin-bottom: 30px; font-family: sans-serif;">RANDEVULAR</h1>
    
    <div style="display: inline-block; width: 95%; max-width: 600px; text-align: left;">
        
        <p style="font-weight: bold; font-size: 18px; margin-bottom: 8px;">Ad Soyad</p>
        <input type="text" id="randevu-isim" placeholder="Kişinin adını ve soyadını yazın..." style="width: 100%; padding: 12px; border-radius: 12px; border: 2px solid #333; font-size: 16px; margin-bottom: 20px; box-sizing: border-box;">
        
        <p style="font-weight: bold; font-size: 18px; margin-bottom: 8px;">Randevu Konusu</p>
        <textarea id="randevu-konu" placeholder="Randevu detaylarını buraya yazın..." style="width: 100%; height: 100px; padding: 15px; border-radius: 15px; border: 2px solid #333; font-size: 16px; margin-bottom: 20px; resize: none; box-sizing: border-box;"></textarea>
        
        <p style="font-weight: bold; font-size: 16px; margin-bottom: 8px;">Tarih ve Saat Ayarla</p>
        <input type="datetime-local" id="randevu-zaman" style="width: 60%; padding: 10px; border-radius: 10px; border: 2px solid #333; margin-bottom: 25px; font-size: 16px; box-sizing: border-box; display: block;">
        
        <div style="text-align: center;">
            <button onclick="randevuKaydet()" style="background: navy; color: white; padding: 12px 50px; border: 2px solid #333; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 18px;">Ekle</button>
        </div>

    </div>

    <div id="randevu-listesi" style="margin-top: 30px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px;"></div>
</div>


  </div> <script src="script.js"></script>
</body>
</html>
